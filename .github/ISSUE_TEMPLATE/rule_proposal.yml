name: 改进建议
description: 提出使用体验或分析方式的改进建议。
labels: ["rule-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        请说明希望改善什么；是否调整决策规则由维护者审核。
        示例请用虚构数据，不要提供私人录取资料、联系方式或财务记录。
  - type: textarea
    id: problem
    attributes:
      label: 希望解决什么问题
      description: 描述当前体验或分析方式的不足。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你建议怎么改善
      description: 说明你希望的效果，无需了解内部文件和测试流程。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充示例（可选）
      description: 可提供虚构场景或相关公开来源。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已去除私人信息，示例使用虚构数据。
          required: true
