name: 使用问题
description: 反馈安装、调用、信息查证或分析结果的问题。
labels: ["production"]
body:
  - type: markdown
    attributes:
      value: |
        请说明遇到的问题，无需判断是规则、模型还是查证造成的。
        请去除姓名、学号、联系方式、真实成绩和财务信息，不要上传完整录取信件。
        安全漏洞或敏感信息泄露请通过 Security → Report a vulnerability 私下报告。
  - type: input
    id: version
    attributes:
      label: 使用环境
      description: 操作系统、AI Agent 名称与版本；知道技能版本时也可补充。
      placeholder: 例如 macOS、Codex、技能 v0.3.2
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 遇到什么问题
      description: 简述使用场景和复现步骤，个人背景请用虚构数据代替。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你原本希望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？可粘贴去除私人信息后的错误提示。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充信息（可选）
      description: 相关公开来源、脱敏截图或其他帮助定位的信息。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已去除私人信息，未上传真实录取信件或个人文件。
          required: true
